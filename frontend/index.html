<!DOCTYPE html>
<!--
  index.html
  Para qué sirve: es la CAPA DE PRESENTACIÓN. Vive aparte del backend
  (carpeta frontend/). Solo HTML: estructura de la página.
  No habla con la base de datos. Consume la API con JavaScript (app.js).
-->
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Artículos de oficina</title>
    <!-- CSS aparte: desacopla el diseño de la estructura. -->
    <link rel="stylesheet" href="css/estilos.css" />
  </head>
  <body>
    <header class="cabecera">
      <p class="etiqueta">Oficina</p>
      <h1>Artículos de oficina</h1>
    </header>

    <main class="contenedor">
      <!-- Formulario: CREATE (POST) y UPDATE (PUT) según haya id o no. -->
      <section class="tarjeta" aria-labelledby="titulo-formulario">
        <h2 id="titulo-formulario">Registrar / editar artículo</h2>
        <p id="modo-formulario" class="ayuda">Modo: crear nuevo</p>

        <form id="form-articulo" novalidate>
          <!-- Hidden: guarda el id cuando se edita. Vacío = POST. -->
          <input type="hidden" id="id" name="id" />

          <label for="nombre">Nombre</label>
          <input
            type="text"
            id="nombre"
            name="nombre"
            placeholder="Ej: Bolígrafo azul"
            required
            minlength="2"
            maxlength="80"
          />

          <label for="categoria">Categoría</label>
          <input
            type="text"
            id="categoria"
            name="categoria"
            placeholder="Ej: Escritura"
            required
            minlength="2"
            maxlength="40"
            list="categorias"
          />
          <!-- Lista de sugerencias; se puede escribir otra categoría. -->
          <datalist id="categorias">
            <option value="Escritura"></option>
            <option value="Papelería"></option>
            <option value="Organización"></option>
            <option value="Herramientas"></option>
          </datalist>

          <div class="fila">
            <div>
              <label for="cantidad">Cantidad</label>
              <input type="number" id="cantidad" name="cantidad" min="0" step="1" required />
            </div>
            <div>
              <label for="precio">Precio</label>
              <input type="number" id="precio" name="precio" min="0.01" step="0.01" required />
            </div>
          </div>

          <div class="acciones">
            <button type="submit" class="boton primario" id="btn-guardar">Guardar</button>
            <button type="button" class="boton" id="btn-cancelar">Cancelar edición</button>
          </div>
        </form>
      </section>

      <!-- Tabla: READ (GET) y acciones UPDATE / DELETE. -->
      <section class="tarjeta" aria-labelledby="titulo-lista">
        <div class="encabezado-lista">
          <h2 id="titulo-lista">Inventario</h2>
          <button type="button" class="boton" id="btn-recargar">Recargar lista</button>
        </div>
        <p id="estado" class="estado">Cargando…</p>
        <div class="tabla-envoltorio">
          <table>
            <thead>
              <tr>
                <th>Id</th>
                <th>Nombre</th>
                <th>Categoría</th>
                <th>Cantidad</th>
                <th>Precio</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody id="cuerpo-tabla">
              <!-- app.js inserta las filas aquí. -->
            </tbody>
          </table>
        </div>
      </section>
    </main>

    <script src="js/app.js"></script>
  </body>
</html>
